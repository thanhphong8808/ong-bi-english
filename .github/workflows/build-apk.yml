# .github/workflows/build-apk.yml
# Builds the Ong Bi English APK for free on GitHub Actions.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Install packages
        run: |
          flutter pub get
          echo "Resolved direct dependencies:"
          flutter pub deps --style=compact --no-dev | sed -n '1,40p' || true

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Validate curriculum
        run: |
          dart run tool/validate_curriculum.dart
          dart run tool/coverage_report.dart

      # Every build must be signed with the same key, or Android refuses to
      # install an update over the old app (and the child's progress is lost).
      # Best: the four KEYSTORE_* secrets (README). Without them, the first
      # build creates a key and keeps it in this repository's Actions cache,
      # which only this repository's workflows can read; keep-signing-key.yml
      # touches it weekly so it is not evicted.
      - name: Restore CI signing key
        id: cikey
        uses: actions/cache/restore@v4
        with:
          path: ci-signing
          key: ongbi-ci-signing-v1

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storeFile=app/upload-keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Signing with the keystore from the repository secrets."
            exit 0
          fi
          if [ ! -f ci-signing/release.jks ]; then
            echo "No signing key yet: creating one and keeping it in the Actions cache."
            mkdir -p ci-signing
            openssl rand -hex 32 > ci-signing/password.txt
            PASS=$(cat ci-signing/password.txt)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore ci-signing/release.jks -storetype PKCS12 \
              -storepass "$PASS" -keypass "$PASS" -alias ongbi -keyalg RSA -keysize 4096 \
              -validity 36500 -dname "CN=Ong Bi English"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          PASS=$(cat ci-signing/password.txt)
          echo "::add-mask::$PASS"
          {
            echo "storeFile=../ci-signing/release.jks"
            echo "storePassword=$PASS"
            echo "keyAlias=ongbi"
            echo "keyPassword=$PASS"
          } > android/key.properties
          echo "Signing with the CI key, certificate SHA-256:"
          keytool -list -keystore ci-signing/release.jks -storepass "$PASS" -alias ongbi | grep -i "SHA-256" || true
        id: signing

      - name: Save CI signing key
        if: steps.signing.outputs.created == 'true'
        uses: actions/cache/save@v4
        with:
          path: ci-signing
          key: ongbi-ci-signing-v1

      # arm64 is the phone build; x86_64 is only for the emulator smoke test.
      - name: Build APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 --build-number ${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/OngBiEnglish-arm64-v8a.apk
          ls -la out build/app/outputs/flutter-apk/
          unzip -l build/app/outputs/flutter-apk/app-x86_64-release.apk | grep "\.so$" || true

      # Guard against the Galaxy S26 Ultra crash: ONNX Runtime builds with
      # KleidiAI SME kernels die with SIGILL on SME-only CPUs.
      - name: Check native libraries
        run: |
          set -e
          mkdir -p native && cd native
          unzip -o -q ../out/OngBiEnglish-arm64-v8a.apk 'lib/arm64-v8a/*'
          ls -la lib/arm64-v8a
          echo "onnxruntime version: $(strings -n 6 lib/arm64-v8a/libonnxruntime.so | grep -m1 -E '^1\.[0-9]+\.[0-9]+$')"
          echo "sherpa-onnx version: $(strings -n 6 lib/arm64-v8a/libsherpa-onnx-c-api.so | grep -m1 -E '^1\.[0-9]+\.[0-9]+$')"
          if strings -n 6 lib/arm64-v8a/libonnxruntime.so | grep -qi kleidiai; then
            echo "::error::libonnxruntime.so contains KleidiAI SME kernels (SIGILL on SME-only CPUs)"
            exit 1
          fi
          python3 - <<'PY'
          import glob, struct, sys
          bad = []
          for f in sorted(glob.glob('lib/arm64-v8a/*.so')):
              d = open(f, 'rb').read()
              phoff = struct.unpack_from('<Q', d, 0x20)[0]
              size, num = struct.unpack_from('<HH', d, 0x36)
              aligns = {struct.unpack_from('<Q', d, phoff + i * size + 48)[0]
                        for i in range(num) if struct.unpack_from('<I', d, phoff + i * size)[0] == 1}
              print(f, sorted(aligns))
              if min(aligns) < 16384:
                  bad.append(f)
          if bad:
              print('::error::not 16 KB aligned:', bad)
              sys.exit(1)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OngBiEnglish-arm64-v8a
          path: out/OngBiEnglish-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload smoke-test APK
        uses: actions/upload-artifact@v4
        with:
          name: smoke-apk
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 3
          if-no-files-found: error

      # A commit marked [no release] is built and tested but not published.
      - name: Publish release
        if: ${{ !contains(github.event.head_commit.message, '[no release]') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ong Bi English - build ${{ github.run_number }}
          body: |
            Bản build tự động. Tải file `OngBiEnglish-arm64-v8a.apk` bên dưới về điện thoại để cài.
          files: out/OngBiEnglish-arm64-v8a.apk

  # Installs the app on an Android emulator, downloads the required model
  # packs like a parent would, opens the main screens and prints the crash
  # buffer, Android's exit reasons and screenshots into the log.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download smoke-test APK
        uses: actions/download-artifact@v4
        with:
          name: smoke-apk
          path: smoke

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # 4 GB: the app skips Gemma, so the run stays short (about 500 MB of
          # models). Talk with Bi is still opened and must rest gracefully.
          ram-size: 4096M
          cores: 4
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash tool/ci/smoke_test.sh smoke/app-x86_64-release.apk
